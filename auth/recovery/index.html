<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>모동노트에서 계속하기</title>
    <style>
      :root { color: #6e523e; background: #f8f4c7; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 20px; }
      main { background: #fff; border-radius: 24px; max-width: 400px; padding: 40px 28px 32px; text-align: center; width: 100%; }
      .brand { align-items: center; color: #6e523e; display: inline-flex; font-size: 14px; font-weight: 700; gap: 8px; letter-spacing: .02em; margin: 0 0 32px; }
      .brand img { display: block; height: 24px; object-fit: contain; width: 24px; }
      h1 { font-size: 24px; letter-spacing: -.03em; line-height: 1.35; margin: 0 0 14px; }
      p { color: rgba(110, 82, 62, .72); font-size: 14px; line-height: 1.6; margin: 0 auto; max-width: 310px; }
      button { background: #74e0aa; border: 0; border-radius: 14px; color: #6e523e; cursor: pointer; font-size: 16px; font-weight: 700; margin-top: 28px; min-height: 52px; padding: 12px 20px; transition: background .15s ease, transform .15s ease; width: 100%; }
      button:hover { background: #63d39c; }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 3px solid #fdc0c7; outline-offset: 3px; }
      .notice { color: rgba(110, 82, 62, .55); font-size: 12px; margin-top: 18px; }
      .error { display: none; }
      .has-error .normal { display: none; }
      .has-error .error { display: block; }
      .has-error button { display: none; }
    </style>
  </head>
  <body>
    <main id="card">
      <p class="brand"><img src="./modongnote-logo.png" alt="" />ACNH Notes by Modong · 모동노트</p>

      <section class="normal">
        <h1>새 비밀번호를 만들어 주세요</h1>
        <p>인증이 완료되었습니다.<br />앱으로 돌아가 비밀번호를 변경해 주세요.</p>
        <button id="open-app" type="button">모동노트 열기</button>
        <p class="notice">Continue in the MoDong Note app</p>
      </section>

      <section class="error" aria-live="polite">
        <h1>링크를 사용할 수 없어요</h1>
        <p>링크가 만료되었거나 이미 사용되었을 수 있어요.<br />앱에서 새 비밀번호 재설정 링크를 요청해 주세요.</p>
      </section>
    </main>

    <script>
      (() => {
        const card = document.getElementById('card');
        const button = document.getElementById('open-app');
        const params = new URLSearchParams(window.location.search);
        const hasAuthPayload = ['code', 'access_token', 'token_hash'].some((key) => params.has(key)) || window.location.hash.length > 1;
        const hasError = params.has('error') || params.has('error_description');

        if (hasError || !hasAuthPayload) {
          card.classList.add('has-error');
          return;
        }

        button.addEventListener('click', () => {
          // Keep the verified payload opaque: never render or log it on this page.
          const appUrl = `modongnote://reset-password${window.location.search}${window.location.hash}`;
          window.location.assign(appUrl);
        });
      })();
    </script>
  </body>
</html>
